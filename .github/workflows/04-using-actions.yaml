name: 04 - Using Actions

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./04-using-actions/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24.x"
            - name: Install dependencies
              run: npm ci
            - name: Run build
              run: npm run build
